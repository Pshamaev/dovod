# Modified for DOVOD: builds the Довод desktop installers from this fork.
# Differences from upstream: artifacts are uploaded for any repository, the
# Windows installer is renamed DOVOD-Setup-<version>-x64.exe, `windows_only`
# limits the matrix to Windows, the Aliyun OSS mirror job is gone and the
# GitHub release is published to this repository.
#
# DESKTOP_016: a push to the dovod-016 branch also triggers this workflow.
# DESKTOP_018 added dovod-018 to the same list, generalizing the DESKTOP_016
# version-label and "report" job below to the actual pushed branch
# (github.ref_name) instead of a literal 'dovod-016', so any future
# dovod-0NN branch can be added here without touching those two spots again.
# `inputs.*` only exists for a workflow_dispatch run, so a push-triggered run
# cannot read it at all (it evaluates to an empty string everywhere). The
# "Resolve inputs" step in the prepare job is the one place that tells the
# two triggers apart and picks safe push defaults (dry_run and windows_only
# true, nothing published); every other step reads its output instead of
# `inputs.*` directly, except run-name and concurrency.group below, which
# run before any job and so cannot see job outputs either.
name: 'Desktop Release'

run-name: 'DOVOD desktop release ${{ inputs.version || github.sha }}'

on:
  push:
    branches:
      - 'dovod-016'
      - 'dovod-018'
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop version, for example 0.1.0 or v0.1.0.'
        required: true
        type: 'string'
      qwen_code_ref:
        description: 'Branch, tag, or commit of this repository to bundle as the runtime (use the DOVOD branch).'
        required: true
        default: 'main'
        type: 'string'
      windows_only:
        description: 'Build only the Windows x64 NSIS installer.'
        required: true
        default: true
        type: 'boolean'
      electron_bridge:
        description: 'Publish the one-time Electron-to-Tauri update bridge for macOS, Windows, and Linux.'
        required: true
        default: false
        type: 'boolean'
      dry_run:
        description: 'Build unsigned installers without publishing.'
        required: true
        default: true
        type: 'boolean'
      draft:
        description: 'Create a draft GitHub release.'
        required: true
        default: true
        type: 'boolean'
      prerelease:
        description: 'Mark the release as a prerelease.'
        required: true
        default: false
        type: 'boolean'
      clobber:
        description: 'Replace same-named assets when uploading to an existing release.'
        required: true
        default: false
        type: 'boolean'

permissions:
  contents: 'read'

concurrency:
  # A push-triggered run gets its own group keyed by ref, so it never queues
  # behind (or ahead of) an unrelated workflow_dispatch publish.
  group: "desktop-release-${{ github.event_name == 'push' && github.ref || (inputs.dry_run && inputs.version || 'publish') }}"
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.9'
  NODE_VERSION: '22.20.0'
  DESKTOP_FEED_TAG: 'desktop-latest'

jobs:
  prepare:
    name: 'Prepare release metadata'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    outputs:
      qwen_code_sha: '${{ steps.source.outputs.sha }}'
      tag: '${{ steps.version.outputs.tag }}'
      version: '${{ steps.version.outputs.version }}'
      matrix: '${{ steps.matrix.outputs.matrix }}'
      dry_run: '${{ steps.inputs.outputs.dry_run }}'
      windows_only: '${{ steps.inputs.outputs.windows_only }}'
      draft: '${{ steps.inputs.outputs.draft }}'
      prerelease: '${{ steps.inputs.outputs.prerelease }}'
      clobber: '${{ steps.inputs.outputs.clobber }}'
      electron_bridge: '${{ steps.inputs.outputs.electron_bridge }}'
    steps:
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          fetch-depth: 0

      - name: 'Resolve inputs'
        id: 'inputs'
        shell: 'bash'
        env:
          IS_DISPATCH: '${{ github.event_name == ''workflow_dispatch'' }}'
          IN_CLOBBER: '${{ inputs.clobber }}'
          IN_DRAFT: '${{ inputs.draft }}'
          IN_DRY_RUN: '${{ inputs.dry_run }}'
          IN_ELECTRON_BRIDGE: '${{ inputs.electron_bridge }}'
          IN_PRERELEASE: '${{ inputs.prerelease }}'
          IN_QWEN_CODE_REF: '${{ inputs.qwen_code_ref }}'
          IN_VERSION: '${{ inputs.version }}'
          IN_WINDOWS_ONLY: '${{ inputs.windows_only }}'
        run: |
          set -euo pipefail
          # DESKTOP_016: a push-triggered run has no `inputs.*` at all (every
          # IN_* variable above is empty), so it always builds dry-run,
          # Windows-only, from the pushed commit, and never reaches the
          # publish job (gated on dry_run == 'false' downstream).
          if [ "$IS_DISPATCH" = 'true' ]; then
            version="$IN_VERSION"
            qwen_code_ref="$IN_QWEN_CODE_REF"
            dry_run="$IN_DRY_RUN"
            windows_only="$IN_WINDOWS_ONLY"
            draft="$IN_DRAFT"
            prerelease="$IN_PRERELEASE"
            clobber="$IN_CLOBBER"
            electron_bridge="$IN_ELECTRON_BRIDGE"
          else
            # DESKTOP_018: branch name instead of a literal "dovod016", so
            # this stays correct for any push-triggered branch in the list
            # above, not only dovod-016.
            version="0.0.0-${GITHUB_REF_NAME//[^a-zA-Z0-9]/}.${GITHUB_SHA:0:12}"
            qwen_code_ref="$GITHUB_SHA"
            dry_run='true'
            windows_only='true'
            draft='true'
            prerelease='true'
            clobber='false'
            electron_bridge='false'
          fi
          {
            echo "version=$version"
            echo "qwen_code_ref=$qwen_code_ref"
            echo "dry_run=$dry_run"
            echo "windows_only=$windows_only"
            echo "draft=$draft"
            echo "prerelease=$prerelease"
            echo "clobber=$clobber"
            echo "electron_bridge=$electron_bridge"
          } >> "$GITHUB_OUTPUT"

      - name: 'Resolve version'
        id: 'version'
        shell: 'bash'
        env:
          ELECTRON_BRIDGE: '${{ steps.inputs.outputs.electron_bridge }}'
          INPUT_VERSION: '${{ steps.inputs.outputs.version }}'
          IS_DRAFT: '${{ steps.inputs.outputs.draft }}'
          IS_DRY_RUN: '${{ steps.inputs.outputs.dry_run }}'
          IS_PRERELEASE: '${{ steps.inputs.outputs.prerelease }}'
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Desktop version must be valid SemVer: $INPUT_VERSION"
            exit 1
          fi
          if [ "$IS_PRERELEASE" = 'true' ] && [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "::error::Desktop prereleases must use a SemVer prerelease suffix, for example 0.2.1-rc.1: $INPUT_VERSION"
            exit 1
          fi
          if [ "$IS_DRY_RUN" = 'false' ] && [ "$IS_DRAFT" = 'false' ] && [ "$IS_PRERELEASE" = 'false' ] && [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Published stable Desktop versions must use X.Y.Z: $INPUT_VERSION"
            exit 1
          fi
          if [ "$ELECTRON_BRIDGE" = 'true' ]; then
            core="${version%%[-+]*}"
            IFS='.' read -r major minor patch <<< "$core"
            if [ "$major" -eq 0 ] && [ "$minor" -eq 0 ] && [ "$patch" -le 5 ]; then
              echo '::error::The Electron bridge version must be newer than desktop-v0.0.5.'
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$version" >> "$GITHUB_OUTPUT"

      - name: 'Resolve Qwen Code source'
        id: 'source'
        shell: 'bash'
        env:
          INPUT_REF: '${{ steps.inputs.outputs.qwen_code_ref }}'
          IS_DRY_RUN: '${{ steps.inputs.outputs.dry_run }}'
        run: |
          set -euo pipefail
          git fetch origin "$INPUT_REF"
          sha="$(git rev-parse FETCH_HEAD)"
          if [ "$IS_DRY_RUN" = 'false' ]; then
            if [ "$GITHUB_REF_NAME" != 'main' ]; then
              echo '::error::Published desktop releases must run from main.'
              exit 1
            fi
            git fetch origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor "$sha" refs/remotes/origin/main; then
              echo '::error::Published desktop releases may only bundle commits reachable from main.'
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: 'Resolve build matrix'
        id: 'matrix'
        shell: 'bash'
        env:
          WINDOWS_ONLY: '${{ steps.inputs.outputs.windows_only }}'
        run: |
          set -euo pipefail
          windows='{"name":"Windows x64","os":"windows-latest","legacy_arch":"","rust_target":"x86_64-pc-windows-msvc","tauri_args":"--target x86_64-pc-windows-msvc --bundles nsis"}'
          macos_arm='{"name":"macOS arm64","os":"macos-latest","legacy_arch":"arm64","rust_target":"aarch64-apple-darwin","tauri_args":"--target aarch64-apple-darwin --bundles app,dmg"}'
          macos_x64='{"name":"macOS x64","os":"macos-15","legacy_arch":"x64","rust_target":"x86_64-apple-darwin","tauri_args":"--target x86_64-apple-darwin --bundles app,dmg"}'
          linux='{"name":"Linux x64","os":"ubuntu-22.04","legacy_arch":"","rust_target":"x86_64-unknown-linux-gnu","tauri_args":"--target x86_64-unknown-linux-gnu --bundles appimage,deb"}'
          if [ "$WINDOWS_ONLY" = 'true' ]; then
            matrix="{\"include\":[$windows]}"
          else
            matrix="{\"include\":[$macos_arm,$macos_x64,$windows,$linux]}"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: 'Build ${{ matrix.name }}'
    needs: 'prepare'
    runs-on: '${{ matrix.os }}'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: '${{ fromJSON(needs.prepare.outputs.matrix) }}'
    env:
      QWEN_CODE_COMMIT: '${{ needs.prepare.outputs.qwen_code_sha }}'
      QWEN_DESKTOP_TARGET: '${{ matrix.rust_target }}'
      # DESKTOP_016: every former `inputs.*` reference in this job reads this
      # job's own env instead, since a push-triggered run has no `inputs.*`
      # at all - see "Resolve inputs" in the prepare job.
      DRY_RUN: '${{ needs.prepare.outputs.dry_run }}'
      ELECTRON_BRIDGE: '${{ needs.prepare.outputs.electron_bridge }}'
    steps:
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
      - name: 'Configure source directory'
        shell: 'bash'
        run: 'echo "QWEN_CODE_ROOT=$RUNNER_TEMP/qwen-code-source" >> "$GITHUB_ENV"'

      - name: 'Check out runtime source'
        shell: 'bash'
        run: |
          set -euo pipefail
          git init "$QWEN_CODE_ROOT"
          git -C "$QWEN_CODE_ROOT" remote add origin "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git"
          git -C "$QWEN_CODE_ROOT" fetch --depth=1 origin "$QWEN_CODE_COMMIT"
          git -C "$QWEN_CODE_ROOT" checkout --detach "$QWEN_CODE_COMMIT"

      - uses: 'actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e' # v6.4.0
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            packages/desktop-shell/package-lock.json

      - name: 'Configure bundled Node.js cache'
        id: 'node-cache-path'
        shell: 'bash'
        run: |
          cache_path="$RUNNER_TEMP/qwen-desktop-node-cache"
          echo "QWEN_DESKTOP_NODE_CACHE_DIR=$cache_path" >> "$GITHUB_ENV"
          echo "path=$cache_path" >> "$GITHUB_OUTPUT"

      - uses: 'actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830' # v4
        id: 'node-cache'
        with:
          path: '${{ steps.node-cache-path.outputs.path }}'
          key: 'desktop-node-v2-${{ matrix.rust_target }}-${{ env.NODE_VERSION }}-${{ env.DRY_RUN }}'

      - uses: 'dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4' # stable
        with:
          targets: '${{ matrix.rust_target }}'

      - uses: 'Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae' # v2
        with:
          workspaces: 'packages/desktop-shell/src-tauri -> target'

      - name: 'Install Linux dependencies'
        if: "runner.os == 'Linux'"
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libatk-bridge2.0-0 at-spi2-core dbus-x11 patchelf libfuse2 xdg-utils xvfb

      - name: 'Install runtime dependencies'
        working-directory: '${{ runner.temp }}/qwen-code-source'
        env:
          QWEN_SKIP_PREPARE: '1'
        run: 'npm ci --no-audit --progress=false'

      - name: 'Install desktop dependencies'
        working-directory: 'packages/desktop-shell'
        run: 'npm ci'

      - name: 'Set desktop version'
        working-directory: 'packages/desktop-shell'
        run: 'node scripts/version.js "${{ needs.prepare.outputs.version }}"'

      - name: 'Require updater signing key for publishing'
        if: "${{ env.DRY_RUN == 'false' }}"
        shell: 'bash'
        env:
          TAURI_SIGNING_PRIVATE_KEY: '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '::warning::TAURI_SIGNING_PRIVATE_KEY is not configured: the release is published without updater signatures (no auto-update).'
          fi

      - name: 'Import macOS certificate'
        if: "runner.os == 'macOS' && env.DRY_RUN == 'false'"
        shell: 'bash'
        env:
          APPLE_CERTIFICATE: '${{ secrets.APPLE_CERTIFICATE }}'
          APPLE_CERTIFICATE_PASSWORD: '${{ secrets.APPLE_CERTIFICATE_PASSWORD }}'
          LEGACY_APPLE_CERTIFICATE: '${{ secrets.MAC_CSC_LINK }}'
          LEGACY_APPLE_CERTIFICATE_PASSWORD: '${{ secrets.MAC_CSC_KEY_PASSWORD }}'
          KEYCHAIN_PASSWORD: '${{ secrets.APPLE_KEYCHAIN_PASSWORD }}'
        run: |
          set -euo pipefail
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ]; then
            certificate_data="$APPLE_CERTIFICATE"
            certificate_password="$APPLE_CERTIFICATE_PASSWORD"
          elif [ -n "$LEGACY_APPLE_CERTIFICATE" ] && [ -n "$LEGACY_APPLE_CERTIFICATE_PASSWORD" ]; then
            certificate_data="$LEGACY_APPLE_CERTIFICATE"
            certificate_password="$LEGACY_APPLE_CERTIFICATE_PASSWORD"
          else
            echo '::error::A complete APPLE_CERTIFICATE pair or MAC_CSC pair is required for published macOS releases.'
            exit 1
          fi
          keychain_password="${KEYCHAIN_PASSWORD:-$(openssl rand -hex 32)}"
          certificate="$RUNNER_TEMP/qwen-code-desktop.p12"
          keychain="$RUNNER_TEMP/qwen-code-desktop.keychain-db"
          certificate_data="${certificate_data#*base64,}"
          printf '%s' "$certificate_data" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$certificate_password" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then echo '::error::Developer ID Application identity was not found.'; exit 1; fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: 'Configure macOS notarization'
        if: "runner.os == 'macOS' && env.DRY_RUN == 'false'"
        shell: 'bash'
        env:
          APPLE_API_ISSUER: '${{ secrets.APPLE_API_ISSUER }}'
          APPLE_API_KEY: '${{ secrets.APPLE_API_KEY }}'
          APPLE_API_KEY_P8: '${{ secrets.APPLE_API_KEY_P8 }}'
          LEGACY_APPLE_API_ISSUER: '${{ secrets.APPLE_NOTARY_ISSUER_ID }}'
          LEGACY_APPLE_API_KEY: '${{ secrets.APPLE_NOTARY_KEY_ID }}'
          LEGACY_APPLE_API_KEY_P8: '${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}'
        run: |
          set -euo pipefail
          if [ -n "$APPLE_API_ISSUER" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            api_issuer="$APPLE_API_ISSUER"
            api_key="$APPLE_API_KEY"
            key_path="$RUNNER_TEMP/AuthKey_${api_key}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          elif [ -n "$LEGACY_APPLE_API_ISSUER" ] && [ -n "$LEGACY_APPLE_API_KEY" ] && [ -n "$LEGACY_APPLE_API_KEY_P8" ]; then
            api_issuer="$LEGACY_APPLE_API_ISSUER"
            api_key="$LEGACY_APPLE_API_KEY"
            key_path="$RUNNER_TEMP/AuthKey_${api_key}.p8"
            printf '%s' "$LEGACY_APPLE_API_KEY_P8" | base64 --decode > "$key_path"
          else
            echo '::error::A complete APPLE_API notarization set or APPLE_NOTARY set is required.'
            exit 1
          fi
          {
            echo "APPLE_API_KEY_PATH=$key_path"
            echo "APPLE_API_ISSUER=$api_issuer"
            echo "APPLE_API_KEY=$api_key"
          } >> "$GITHUB_ENV"

      - name: 'Import Windows certificate'
        if: "runner.os == 'Windows' && env.DRY_RUN == 'false'"
        shell: 'pwsh'
        env:
          WINDOWS_CERTIFICATE: '${{ secrets.WINDOWS_CERTIFICATE }}'
          WINDOWS_CERTIFICATE_PASSWORD: '${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}'
          LEGACY_WIN_CSC_LINK: '${{ secrets.WIN_CSC_LINK }}'
          LEGACY_WIN_CSC_KEY_PASSWORD: '${{ secrets.WIN_CSC_KEY_PASSWORD }}'
        run: |
          # Prefer the Tauri-style WINDOWS_CERTIFICATE pair; fall back to the
          # legacy electron-builder WIN_CSC_LINK pair if only that exists.
          $pfx = $null
          $pfxPassword = $null
          $primaryIncomplete = ([bool]$env:WINDOWS_CERTIFICATE) -ne ([bool]$env:WINDOWS_CERTIFICATE_PASSWORD)
          $legacyIncomplete = ([bool]$env:LEGACY_WIN_CSC_LINK) -ne ([bool]$env:LEGACY_WIN_CSC_KEY_PASSWORD)
          if ($primaryIncomplete -or $legacyIncomplete) {
            throw 'Incomplete Windows signing configuration: provide a complete WINDOWS_CERTIFICATE/WINDOWS_CERTIFICATE_PASSWORD pair or WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD pair.'
          }
          if ($env:WINDOWS_CERTIFICATE -and $env:WINDOWS_CERTIFICATE_PASSWORD) {
            $pfx = $env:WINDOWS_CERTIFICATE
            $pfxPassword = $env:WINDOWS_CERTIFICATE_PASSWORD
          } elseif ($env:LEGACY_WIN_CSC_LINK -and $env:LEGACY_WIN_CSC_KEY_PASSWORD) {
            $pfx = $env:LEGACY_WIN_CSC_LINK
            $pfxPassword = $env:LEGACY_WIN_CSC_KEY_PASSWORD
          }
          if ($pfx) {
            $path = Join-Path $env:RUNNER_TEMP 'qwen-code-desktop.pfx'
            [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($pfx))
            $password = ConvertTo-SecureString $pfxPassword -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
            $windowsConfig = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint } } } | ConvertTo-Json -Compress -Depth 3
            "WINDOWS_CONFIG=$windowsConfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Output "::warning::Windows signing certificate is not configured. Windows artifacts will be unsigned and may trigger SmartScreen warnings."
          }

      - name: 'Prepare bundled runtime'
        working-directory: 'packages/desktop-shell'
        env:
          # DESKTOP_016: read-only token for the private dovod-tools release
          # in Pshamaev/node-djkdrpae (see dovod-tools.json and the
          # installDovodTools() step in prepare-runtime.js).
          DOVOD_TOOLS_TOKEN: '${{ secrets.DOVOD_TOOLS_TOKEN }}'
        run: 'npm run build:runtime'

      - uses: 'actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830' # v4
        if: "${{ steps.node-cache.outputs.cache-hit != 'true' }}"
        with:
          path: '${{ steps.node-cache-path.outputs.path }}'
          key: 'desktop-node-v2-${{ matrix.rust_target }}-${{ env.NODE_VERSION }}-${{ env.DRY_RUN }}'

      - name: 'Run desktop tests'
        working-directory: 'packages/desktop-shell'
        run: 'npm test'

      - name: 'Run desktop release tests'
        working-directory: 'packages/desktop-shell'
        run: 'npm run test:release'

      - name: 'Sign bundled vendor binaries (macOS)'
        if: "runner.os == 'macOS' && env.DRY_RUN == 'false'"
        working-directory: 'packages/desktop-shell'
        shell: 'bash'
        env:
          APPLE_SIGNING_IDENTITY: '${{ env.APPLE_SIGNING_IDENTITY }}'
        run: |
          set -euo pipefail
          # Sign all native macOS executables in the bundled runtime so
          # notarization does not reject them. Tauri only signs the main
          # app binary; resources like ripgrep and the Node.js runtime are
          # embedded verbatim and must be signed beforehand.
          runtime_dir="runtime/qwen-code"
          # ripgrep vendor binaries
          rg_dir="$runtime_dir/lib/vendor/ripgrep"
          if [ -d "$rg_dir" ]; then
            find "$rg_dir" -type f -name 'rg' -path '*-darwin/*' -exec \
              codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
              --options runtime --timestamp \
              {} +
          else
            echo "::warning::Ripgrep vendor directory not found at $rg_dir; no ripgrep binaries signed."
          fi
          # Node.js runtime binary
          node_bin="$runtime_dir/node/bin/node"
          if [ -f "$node_bin" ]; then
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
              --options runtime --timestamp \
              --entitlements src-tauri/NodeEntitlements.plist "$node_bin"
          else
            echo "::warning::Node.js runtime binary not found at $node_bin; no Node.js binary signed."
          fi

      - name: 'Refresh bundled runtime checksums after signing (macOS)'
        if: "runner.os == 'macOS' && env.DRY_RUN == 'false'"
        working-directory: 'packages/desktop-shell'
        run: 'node scripts/prepare-runtime.js --refresh-checksums'

      - name: 'Verify bundled runtime'
        working-directory: 'packages/desktop-shell'
        run: 'npm run smoke:runtime'

      - name: 'Build desktop installers'
        working-directory: 'packages/desktop-shell'
        shell: 'bash'
        env:
          DRY_RUN: '${{ env.DRY_RUN }}'
          TAURI_SIGNING_PRIVATE_KEY: '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: '${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}'
          WINDOWS_CONFIG: '${{ env.WINDOWS_CONFIG }}'
        run: |
          set -euo pipefail
          args=( ${{ matrix.tauri_args }} )
          if [ "$DRY_RUN" = 'true' ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            args+=(--no-sign)
          elif [ "$RUNNER_OS" = 'Windows' ] && [ -n "$WINDOWS_CONFIG" ]; then
            args+=(--config "$WINDOWS_CONFIG")
          fi
          npm run tauri -- build "${args[@]}"

      - name: 'Verify macOS signature'
        if: "runner.os == 'macOS' && env.DRY_RUN == 'false'"
        shell: 'bash'
        run: |
          set -euo pipefail
          app="$(find packages/desktop-shell/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          entitlements="$(mktemp)"
          trap 'rm -f "$entitlements"' EXIT
          codesign -d --entitlements - --xml "$app" > "$entitlements" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$entitlements")" = true

      - name: 'Verify Windows signature'
        if: "runner.os == 'Windows' && env.DRY_RUN == 'false'"
        shell: 'pwsh'
        env:
          WINDOWS_CONFIG: '${{ env.WINDOWS_CONFIG }}'
        run: |
          $installer = Get-ChildItem packages/desktop-shell/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -eq 'Valid') {
            Write-Output "Windows installer is Authenticode-signed."
          } elseif ($signature.Status -eq 'NotSigned' -and -not $env:WINDOWS_CONFIG) {
            Write-Output "::warning::Windows installer is unsigned (no code signing certificate configured). SmartScreen will warn users on first install."
          } else {
            throw "Invalid Authenticode signature: $($signature.Status)"
          }

      - name: 'Create Electron bridge archive'
        if: "runner.os == 'macOS' && env.ELECTRON_BRIDGE == 'true'"
        shell: 'bash'
        env:
          LEGACY_ARCH: '${{ matrix.legacy_arch }}'
        run: |
          set -euo pipefail
          app="$(find packages/desktop-shell/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo '::error::The legacy-named macOS app bundle was not produced.'
            exit 1
          fi
          destination="packages/desktop-shell/src-tauri/target/${{ matrix.rust_target }}/release/bundle/electron-bridge"
          mkdir -p "$destination"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$destination/Qwen-Code-Desktop-$LEGACY_ARCH.zip"

      - name: 'Smoke packaged application'
        if: "runner.os == 'macOS'"
        working-directory: 'packages/desktop-shell'
        shell: 'bash'
        run: |
          set -euo pipefail
          executable="$(find src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos -path '*.app/Contents/MacOS/*' -type f -perm -111 -print -quit)"
          info_plist="$(dirname "$(dirname "$executable")")/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$info_plist" >/dev/null
          npm run smoke:packaged -- "$executable"

      - name: 'Smoke packaged application'
        if: "runner.os == 'Windows'"
        working-directory: 'packages/desktop-shell'
        shell: 'pwsh'
        run: |
          $executable = Get-ChildItem src-tauri/target/${{ matrix.rust_target }}/release/dovod.exe | Select-Object -First 1
          npm run smoke:packaged -- $executable.FullName

      - name: 'Smoke packaged application'
        if: "runner.os == 'Linux'"
        working-directory: 'packages/desktop-shell'
        shell: 'bash'
        run: |
          set -euo pipefail
          xvfb-run -a npm run smoke:packaged -- src-tauri/target/${{ matrix.rust_target }}/release/dovod

      - name: 'Collect artifacts'
        shell: 'bash'
        env:
          LEGACY_ARCH: '${{ matrix.legacy_arch }}'
          RELEASE_VERSION: '${{ needs.prepare.outputs.version }}'
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/desktop-artifacts"
          mkdir -p "$destination"
          bundle_root="packages/desktop-shell/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          while IFS= read -r -d '' artifact; do
            name="$(basename "$artifact")"
            if [ "$RUNNER_OS" = 'macOS' ]; then
              extension=''
              stem="$name"
              case "$name" in
                *.app.tar.gz.sig) stem="${name%.app.tar.gz.sig}"; extension='.app.tar.gz.sig' ;;
                *.app.tar.gz) stem="${name%.app.tar.gz}"; extension='.app.tar.gz' ;;
                *.dmg) name="Qwen-Code-Desktop-$LEGACY_ARCH.dmg" ;;
                Qwen-Code-Desktop-*.zip) ;;
                *) continue ;;
              esac
              if [ -n "$extension" ]; then
                name="${stem}-${{ matrix.rust_target }}${extension}"
              fi
            elif [ "$RUNNER_OS" = 'Windows' ]; then
              # DOVOD: Tauri names the installer after the Cyrillic product
              # name; publish it under the ASCII DOVOD-Setup name instead.
              case "$name" in
                *-setup.exe) name="DOVOD-Setup-$RELEASE_VERSION-x64.exe" ;;
                *-setup.exe.sig) name="DOVOD-Setup-$RELEASE_VERSION-x64.exe.sig" ;;
                *) continue ;;
              esac
            elif [ "$RUNNER_OS" = 'Linux' ]; then
              case "$name" in
                *.AppImage|*.AppImage.sig|*.deb|*.deb.sig) ;;
                *) continue ;;
              esac
            fi
            name="${name// /-}"
            cp "$artifact" "$destination/$name"
          done < <(find "$bundle_root" -mindepth 2 -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.zip' -o -name '*.app.tar.gz' -o -name '*.sig' \) -print0)
          if [ -z "$(find "$destination" -type f -print -quit)" ]; then
            echo '::error::No desktop artifacts were produced.'
            exit 1
          fi

      - name: 'List artifacts'
        shell: 'bash'
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/desktop-artifacts" -maxdepth 1 -type f -print
      - uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' # v7.0.1
        with:
          name: 'dovod-desktop-${{ matrix.rust_target }}'
          path: '${{ runner.temp }}/desktop-artifacts/*'
          if-no-files-found: 'error'
          retention-days: 1

  publish:
    name: 'Publish GitHub release'
    if: "${{ needs.prepare.outputs.dry_run == 'false' }}"
    needs:
      - 'prepare'
      - 'build'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    permissions:
      contents: 'write'
    steps:
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3

      - uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        with:
          path: 'release-assets'
          merge-multiple: true

      - name: 'Generate checksums and updater manifest'
        shell: 'bash'
        env:
          ELECTRON_BRIDGE: '${{ needs.prepare.outputs.electron_bridge }}'
          GH_REPO: '${{ github.repository }}'
          RELEASE_TAG: '${{ needs.prepare.outputs.tag }}'
          RELEASE_VERSION: '${{ needs.prepare.outputs.version }}'
        run: |
          set -euo pipefail
          cd release-assets
          # Generate the updater manifest before checksumming so SHA256SUMS.txt
          # also covers desktop-latest.json (fetched unauthenticated by clients).
          # DOVOD: skipped when the build ran without updater signatures
          # (no TAURI_SIGNING_PRIVATE_KEY) or only Windows was built.
          if compgen -G '*.sig' >/dev/null && ls -- *-apple-darwin.app.tar.gz >/dev/null 2>&1; then
            node ../.github/scripts/create-desktop-update-manifest.mjs \
              --assets . \
              --repository "$GH_REPO" \
              --tag "$RELEASE_TAG" \
              --version "$RELEASE_VERSION" \
              --output desktop-latest.json
          else
            echo '::notice::Updater manifest skipped: unsigned or Windows-only build.'
          fi
          if [ "$ELECTRON_BRIDGE" = 'true' ]; then
            for manifest in macos:latest-mac.yml windows:latest.yml linux:latest-linux.yml; do
              platform="${manifest%%:*}"
              output="${manifest#*:}"
              node ../.github/scripts/create-electron-bridge-manifest.mjs \
                --assets . \
                --platform "$platform" \
                --version "$RELEASE_VERSION" \
                --output "$output"
            done
          fi
          sha256sum -- * > SHA256SUMS.txt

      - name: 'Create GitHub release'
        id: 'release'
        env:
          GH_TOKEN: '${{ github.token }}'
          RELEASE_TAG: '${{ needs.prepare.outputs.tag }}'
          RELEASE_VERSION: '${{ needs.prepare.outputs.version }}'
          RELEASE_DRAFT: '${{ needs.prepare.outputs.draft }}'
          RELEASE_PRERELEASE: '${{ needs.prepare.outputs.prerelease }}'
          RELEASE_CLOBBER: '${{ needs.prepare.outputs.clobber }}'
        run: |
          set -euo pipefail
          args=("$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" --title "Довод (DOVOD) v$RELEASE_VERSION" --generate-notes --latest=false)
          if [ "$RELEASE_DRAFT" = 'true' ]; then args+=(--draft); fi
          if [ "$RELEASE_PRERELEASE" = 'true' ]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$RELEASE_CLOBBER" != 'true' ]; then
              echo "::error::Release $RELEASE_TAG already exists. Re-run with clobber=true to replace its assets."
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            edit_args=()
            if [ "$RELEASE_DRAFT" = 'true' ]; then edit_args+=(--draft); else edit_args+=(--draft=false); fi
            if [ "$RELEASE_PRERELEASE" = 'true' ]; then edit_args+=(--prerelease); else edit_args+=(--prerelease=false); fi
            gh release edit "$RELEASE_TAG" "${edit_args[@]}"
            release_url="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
          else
            release_url="$(gh release create "${args[@]}")"
          fi
          echo "url=$release_url" >> "$GITHUB_OUTPUT"

      - name: 'Update stable updater feed'
        if: "${{ needs.prepare.outputs.draft == 'false' && needs.prepare.outputs.prerelease == 'false' }}"
        env:
          ELECTRON_BRIDGE: '${{ needs.prepare.outputs.electron_bridge }}'
          GH_TOKEN: '${{ github.token }}'
          FEED_TAG: '${{ env.DESKTOP_FEED_TAG }}'
          RELEASE_VERSION: '${{ needs.prepare.outputs.version }}'
        run: |
          set -euo pipefail
          if [ ! -f release-assets/desktop-latest.json ]; then
            echo '::notice::Stable updater feed not updated: no updater manifest in this release.'
            exit 0
          fi
          feed_assets=(release-assets/desktop-latest.json)
          if [ "$ELECTRON_BRIDGE" = 'true' ]; then
            shopt -s nullglob
            windows_installers=(release-assets/*-setup.exe)
            linux_appimages=(release-assets/*.AppImage)
            if [ "${#windows_installers[@]}" -ne 1 ] || [ "${#linux_appimages[@]}" -ne 1 ]; then
              echo '::error::The Electron bridge requires one Windows installer and one Linux AppImage.'
              exit 1
            fi
            feed_assets+=(
              release-assets/latest-mac.yml
              release-assets/latest.yml
              release-assets/latest-linux.yml
              release-assets/Qwen-Code-Desktop-arm64.zip
              release-assets/Qwen-Code-Desktop-x64.zip
              release-assets/Qwen-Code-Desktop-arm64.dmg
              release-assets/Qwen-Code-Desktop-x64.dmg
              "${windows_installers[0]}"
              "${linux_appimages[0]}"
            )
          fi
          if gh release view "$FEED_TAG" >/dev/null 2>&1; then
            directory="$(mktemp -d)"
            trap 'rm -rf "$directory"' EXIT
            gh release download "$FEED_TAG" --dir "$directory" --pattern 'desktop-latest.json'
            current="$(jq -r '.version' "$directory/desktop-latest.json")"
            if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Current Desktop stable feed has an invalid version: $current"
              exit 1
            fi
            newest="$(printf '%s\n%s\n' "$RELEASE_VERSION" "$current" | sort -V | tail -n 1)"
            if [ "$current" != "$RELEASE_VERSION" ] && [ "$newest" = "$current" ]; then
              if [ "$ELECTRON_BRIDGE" = 'true' ]; then
                echo "::error::Electron bridge $RELEASE_VERSION cannot replace newer stable feed $current."
                exit 1
              fi
              echo "::notice::Desktop $RELEASE_VERSION will not replace newer stable feed $current."
              exit 0
            fi
            gh release upload "$FEED_TAG" "${feed_assets[@]}" --clobber
          else
            gh release create "$FEED_TAG" "${feed_assets[@]}" --title 'Довод (DOVOD) latest' --notes 'Stable desktop updater feed.' --latest=false
          fi

      - name: 'Publish release summary'
        env:
          RELEASE_TAG: '${{ needs.prepare.outputs.tag }}'
          RELEASE_VERSION: '${{ needs.prepare.outputs.version }}'
          RELEASE_URL: '${{ steps.release.outputs.url }}'
        run: |
          {
            echo '## DOVOD desktop release'
            echo
            echo "Version: $RELEASE_VERSION"
            echo "Tag: $RELEASE_TAG"
            echo "Release: $RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # DESKTOP_016: a push-triggered run (always dry_run) commits its own result
  # back into the branch that triggered it, so it can be read as a file
  # instead of only as a workflow run page. `always()` so a build failure
  # still produces a report instead of silently leaving nothing in the
  # branch. DESKTOP_018 generalized the branch from a literal 'dovod-016' to
  # github.ref_name, so this works the same for dovod-018 (or any future
  # push-triggered branch added to `on.push.branches` above) without edits.
  report:
    name: 'Commit run summary to the push branch'
    if: "${{ always() && github.event_name == 'push' }}"
    needs:
      - 'prepare'
      - 'build'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      actions: 'read'
      contents: 'write'
    steps:
      - uses: 'actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10' # v6.0.3
        with:
          ref: '${{ github.ref_name }}'

      - uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c' # v8.0.1
        continue-on-error: true
        with:
          pattern: 'dovod-desktop-*'
          path: 'run-artifacts'
          merge-multiple: true

      - name: 'Write and commit run summary'
        shell: 'bash'
        env:
          GH_TOKEN: '${{ github.token }}'
          GH_REPO: '${{ github.repository }}'
          RUN_ID: '${{ github.run_id }}'
          PREPARE_RESULT: '${{ needs.prepare.result }}'
          BUILD_RESULT: '${{ needs.build.result }}'
          COMMIT_SHA: '${{ github.sha }}'
        run: |
          set -euo pipefail
          # DESKTOP_018: GITHUB_REF_NAME is the branch this run was pushed
          # to (a default Actions env var, not declared in `env:` above) -
          # 'dovod-016' for the original dovod-016 reports, 'dovod-018' here.
          mkdir -p "docs/reports/${GITHUB_REF_NAME}"
          report="docs/reports/${GITHUB_REF_NAME}/${RUN_ID}.md"
          # Пагинация gh api не нужна: один прогон этого workflow даёт не
          # больше нескольких job, в лимит одной страницы укладывается.
          {
            echo "# Прогон desktop-release.yml #$RUN_ID"
            echo
            echo "Коммит дела: $COMMIT_SHA"
            echo "Итог prepare: $PREPARE_RESULT"
            echo "Итог build: $BUILD_RESULT"
            echo
            echo '## Шаги и коды'
            gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[] | "### " + .name + " - " + (.conclusion // "в процессе") + "\n" + ((.steps // []) | map("- " + .name + ": " + (.conclusion // "пропущен")) | join("\n")) + "\n"' \
              || echo 'Не удалось прочитать шаги прогона через gh api.'
            echo
            echo '## Установщик'
            if compgen -G 'run-artifacts/*.exe' >/dev/null 2>&1; then
              for installer in run-artifacts/*.exe; do
                size_bytes="$(stat -c%s "$installer")"
                echo "- $(basename "$installer"): ${size_bytes} байт"
              done
            else
              echo 'Установщик (*.exe) не найден среди артефактов прогона.'
            fi
            echo
            echo '## Ошибки'
            gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
              --jq '.jobs[].steps[]? | select(.conclusion == "failure") | "- " + .name' \
              || echo 'Не удалось прочитать список ошибок через gh api.'
          } > "$report"
          if [ ! -s "$report" ]; then
            echo 'Отчёт получился пустым, не коммитим.'
            exit 0
          fi
          git config user.name 'dovod-ci'
          git config user.email 'ci@dovod.law'
          git add "$report"
          if git diff --cached --quiet; then
            echo 'Итог прогона не изменился, коммитить нечего.'
            exit 0
          fi
          git commit -m "ci: итог прогона desktop-release #$RUN_ID (prepare $PREPARE_RESULT, build $BUILD_RESULT)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
